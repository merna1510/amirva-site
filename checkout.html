<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AMIRVA Jewelry — Checkout</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="contariar">

        <header class="navbar">
            <a href="index.html" class="logo" aria-label="AMIRVA home">
                <svg class="logo-mark" viewBox="0 0 100 100" aria-hidden="true">
                    <g stroke="currentColor" stroke-width="1.6" stroke-linecap="round" fill="none">
                        <line x1="50" y1="62" x2="12" y2="52"/>
                        <line x1="50" y1="62" x2="15" y2="38"/>
                        <line x1="50" y1="62" x2="22" y2="26"/>
                        <line x1="50" y1="62" x2="31" y2="17"/>
                        <line x1="50" y1="62" x2="40" y2="12"/>
                        <line x1="50" y1="62" x2="50" y2="10"/>
                        <line x1="50" y1="62" x2="60" y2="12"/>
                        <line x1="50" y1="62" x2="69" y2="17"/>
                        <line x1="50" y1="62" x2="78" y2="26"/>
                        <line x1="50" y1="62" x2="85" y2="38"/>
                        <line x1="50" y1="62" x2="88" y2="52"/>
                        <path d="M12 52 Q14 22 50 10 Q86 22 88 52"/>
                    </g>
                    <path d="M50 64 C40 72 42 84 50 92 C58 84 60 72 50 64 Z" fill="currentColor"/>
                    <path d="M28 66 Q38 64 48 72 M72 66 Q62 64 52 72" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>
                </svg>
                <span class="logo-text">AMIRVA</span>
            </a>

            <nav class="nav-links" aria-label="Main">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="web.html">Shop</a></li>
                    <li><a href="index.html#contact">Contact</a></li>
                </ul>
            </nav>

            <div class="nav-icons">
                <a href="#" class="icon-btn" aria-label="Account">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.8"/><path d="M4.5 20.5 C5.5 15.5 18.5 15.5 19.5 20.5"/></svg>
                </a>
                <a href="cart.html" class="icon-btn cart-link" aria-label="Cart">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8.5 H19 L18 20.5 H6 Z"/><path d="M9 8.5 V7 A3 3 0 0 1 15 7 V8.5"/></svg>
                    <span id="cart-count" class="cart-badge">0</span>
                </a>
            </div>
        </header>

        <section class="shop-head">
            <div class="eyebrow">Almost There</div>
            <h1 class="section-title">Checkout</h1>
        </section>

        <form class="checkout-page" id="checkout-form" novalidate>

            <div class="auth-card">

                <h2 style="margin-top:0;">Shipping details</h2>

                <div class="field">
                    <label for="full-name">Full name</label>
                    <input type="text" id="full-name" placeholder="Ahmed Mostafa">
                    <p class="field-error" id="full-name-error"></p>
                </div>

                <div class="field">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="12 Nile Street, Apt 4">
                    <p class="field-error" id="address-error"></p>
                </div>

                <div class="field-row">
                    <div class="field">
                        <label for="city">City</label>
                        <input type="text" id="city" placeholder="Cairo">
                        <p class="field-error" id="city-error"></p>
                    </div>
                    <div class="field">
                        <label for="postal-code">Postal code</label>
                        <input type="text" id="postal-code" placeholder="11511" inputmode="numeric">
                        <p class="field-error" id="postal-code-error"></p>
                    </div>
                </div>

                <hr style="border:none; border-top:1px solid #e8e2d6; margin:1.5rem 0;">

                <h2 style="margin-top:0;">Payment method</h2>

                <div class="payment-options">
                    <label class="payment-option">
                        <input type="radio" name="payment-method" id="pay-online" value="online" checked>
                        <span class="payment-option-label">
                            <strong>Pay online</strong>
                            <span class="section-hint" style="margin:0;">Pay now with a debit or credit card.</span>
                        </span>
                    </label>
                    <label class="payment-option">
                        <input type="radio" name="payment-method" id="pay-cod" value="cod">
                        <span class="payment-option-label">
                            <strong>Cash on delivery</strong>
                            <span class="section-hint" style="margin:0;">Pay in cash when your order arrives.</span>
                        </span>
                    </label>
                </div>

                <div id="card-fields">
                    <p class="section-hint">This is a demo form — no real payment is processed.</p>

                    <div class="field">
                        <label for="card-name">Name on card</label>
                        <input type="text" id="card-name" placeholder="Ahmed Mostafa">
                        <p class="field-error" id="card-name-error"></p>
                    </div>

                    <div class="field">
                        <label for="card-number">Card number</label>
                        <input type="text" id="card-number" placeholder="1234 5678 9012 3456" inputmode="numeric" maxlength="19">
                        <p class="field-error" id="card-number-error"></p>
                    </div>

                    <div class="field-row">
                        <div class="field">
                            <label for="card-expiry">Expiry (MM/YY)</label>
                            <input type="text" id="card-expiry" placeholder="MM/YY" inputmode="numeric" maxlength="5">
                            <p class="field-error" id="card-expiry-error"></p>
                        </div>
                        <div class="field">
                            <label for="card-cvv">CVV</label>
                            <input type="text" id="card-cvv" placeholder="123" inputmode="numeric" maxlength="4">
                            <p class="field-error" id="card-cvv-error"></p>
                        </div>
                    </div>
                </div>

                <button type="submit" class="cta-btn auth-submit" id="place-order-btn">Place Order</button>
            </div>

            <aside class="checkout-summary">
                <h2>Order summary</h2>
                <div class="checkout-line-items" id="checkout-line-items"></div>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="checkout-subtotal">0 EGY</span>
                </div>
                <div class="summary-row" id="checkout-discount-row" style="display:none;">
                    <span>Discount</span>
                    <span id="checkout-discount">0 EGY</span>
                </div>
                <div class="summary-row total-row">
                    <span>Total</span>
                    <span id="checkout-total">0 EGY</span>
                </div>
            </aside>

        </form>

        <footer class="site-footer" id="contact">
            <div class="foot-bottom">
                <div class="copy">© 2026 AMIRVA Jewelry. All rights reserved.</div>
                <div class="legal"><a href="#">Privacy</a><a href="#">Terms</a></div>
            </div>
        </footer>

    </div>

    <script src="data.js"></script>
    <script src="utils.js"></script>
    <script src="cart.js"></script>
    <script src="nav.js"></script>
    <script src="auth.js"></script>
    <script src="checkout.js"></script>

</body>

</html>
