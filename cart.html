<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jewelry - Cart</title>
    <link rel="stylesheet" href="web.css">
    <link rel="stylesheet" href="cart.css">
</head>

<body>

    <div class="contariar">

        <div class="navbar">
            <div class="logo">
                <img src="images.jpeg" alt="logo">
            </div>

            <ul>
                <li><a href="web.html">Home</a></li>
                <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
            </ul>
        </div>

        <br>
        <hr>
        <br>

        <h1 class="cart-title">Your Cart</h1>

        <div class="cart-page">

            <div class="cart-items" id="cart-items">
                
            </div>

            <div class="cart-summary" id="cart-summary">
                <h2>Order summary</h2>

                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal-value">0 EGY</span>
                </div>

                <div class="summary-row discount-row" id="discount-row" style="display:none;">
                    <span>Discount</span>
                    <span id="discount-value">0 EGY</span>
                </div>

                <div class="discount-form">
                    <input type="text" id="discount-input" placeholder="Discount code">
                    <button type="button" id="apply-discount-btn">Apply</button>
                </div>
                <p class="error-text" id="discount-error">code is invalide</p>

                <hr>

                <div class="summary-row total-row">
                    <span>Total</span>
                    <span id="total-value">0 EGY</span>
                </div>

                <button type="button" class="buy checkout-btn" id="checkout-btn">Checkout</button>
            </div>

        </div>

    </div>

    <script src="data.js"></script>
    <script src="utils.js"></script>
    <script src="cart.js"></script>
    <script src="cart-page.js"></script>

</body>

</html>
